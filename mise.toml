[tasks.install]
description = "Copy Herdr XP into the Herdr app (~/.config/herdr-app) and check the mod"
run = [
  "python3 -I scripts/install.py",
  "herdr-app check ${HERDR_APP_HOME:-$HOME/.config/herdr-app}/mods/winxp",
]

[tasks.uninstall]
description = "Remove Herdr XP from the Herdr app"
run = "python3 -I scripts/install.py --uninstall"

[tasks.check]
description = "Check the installed mod loads"
run = "herdr-app check ${HERDR_APP_HOME:-$HOME/.config/herdr-app}/mods/winxp"

[tasks.show]
description = "Switch the Herdr app to the Herdr XP layout"
run = "herdr-app do layout.switch '{\"name\":\"winxp\"}'"

[tasks.shot]
description = "Screenshot the Herdr window to preview.png"
run = "herdr-app shot preview.png"

[tasks.test]
description = "Verify staged installation and rollback, and the bars' folder watch"
run = [
  "python3 -m unittest discover -s tests -p 'test_*.py'",
  "node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test 'tests/*.test.mjs'",
]
